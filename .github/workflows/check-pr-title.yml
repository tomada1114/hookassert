name: Check PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Validate the Conventional Commit prefix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read the title only. The result is reported as this job's own status,
      # never written back to the pull request, so a fork PR needs no token
      # beyond the read-only one it already gets.
      pull-requests: read # to read the pull request title
    steps:
      # The squash-merge commit subject is the PR title, so this is what keeps
      # the generated changelog and the release note categories coherent.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Stated rather than inherited: the action's built-in default does not
          # include `deps`, which is the prefix .github/dependabot.yml puts on
          # every dependency commit, so bot and batched-bot PRs failed this
          # check for a reason no one could read off the workflow.
          # tests/workflows.test.ts requires every Dependabot prefix to appear
          # here, and .github/release.yml to have a category for the label
          # pr-label.yml derives from it.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
          ignoreLabels: |
            dependencies
