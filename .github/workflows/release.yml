name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# The runner's default `bash -e` leaves an unset variable expanding to the empty
# string and a failing command inside a pipeline invisible — both of which turn
# a check below into a comparison against nothing. Every `run:` here is bash,
# and every one of them fails closed.
defaults:
  run:
    shell: "bash --noprofile --norc -eo pipefail -u {0}"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # package-manager-cache: false — this workflow builds a runtime
      # artifact from a tag push, and setup-node's default cache restore is a
      # cache-poisoning vector in exactly that context.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        id: verify-tag
        run: |
          VERSION="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          }

          # A prerelease identifier (`1.0.0-rc.1` -> `rc`, `1.0.0-next.3` ->
          # `next`) becomes the npm dist-tag it publishes to, so a release
          # candidate never moves `latest`. A version with no prerelease
          # component publishes to `latest`, written out explicitly rather
          # than left as npm's implicit default. Extracted with the same
          # `node --input-type=module` reader used for VERSION above, so the
          # version string is parsed once, by one interpreter, instead of a
          # second time by a hand-rolled shell regex.
          PRERELEASE_ID="$(VERSION="${VERSION}" node --input-type=module -e 'import process from "node:process"; const match = process.env.VERSION.match(/^\d+\.\d+\.\d+-([^.]+)/); process.stdout.write(match ? match[1] : "")')"
          if [ "${PRERELEASE_ID}" = "latest" ]; then
            echo "::error::Prerelease identifier \"latest\" in version ${VERSION} would publish over npm's latest dist-tag. Choose a different identifier."
            exit 1
          fi
          if [ -n "${PRERELEASE_ID}" ]; then
            echo "dist_tag=${PRERELEASE_ID}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dist_tag=latest" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This gate builds dist exactly once. Artifact checks run after the one
      # pack below, against the fixed release tarball.
      - name: Check source and build once
        run: pnpm run check:source

      - name: Check whether this version is already published
        id: registry
        run: |
          PACKAGE="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.name)')"
          VERSION="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pack the new release artifact once
        if: steps.registry.outputs.published != 'true'
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          TARBALL="$(find dist -maxdepth 1 -name '*.tgz' -type f)"
          test "$(printf '%s\n' "${TARBALL}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          mv "${TARBALL}" dist/package.tgz

      # A rerun after npm accepted the version must attach npm's original
      # bytes, not a newly generated equivalent tarball.
      - name: Recover the already-published artifact
        if: steps.registry.outputs.published == 'true'
        run: |
          PACKAGE="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.name)')"
          VERSION="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          mkdir -p dist
          npm pack "${PACKAGE}@${VERSION}" --pack-destination dist
          TARBALL="$(find dist -maxdepth 1 -name '*.tgz' -type f)"
          test "$(printf '%s\n' "${TARBALL}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          mv "${TARBALL}" dist/package.tgz

      - name: Verify the exact release artifact
        run: pnpm run package:verify -- --tarball dist/package.tgz

      # No --access/--provenance/--registry flags: package.json's
      # publishConfig is the single source for all three, so a rehearsal, a
      # manual publish and this workflow cannot disagree about them. --tag is
      # the one flag that has to live here instead: publishConfig is static
      # and cannot express a per-release dist-tag decision, so a stable
      # version passes "latest" explicitly and a prerelease version passes
      # its own identifier (verify-tag's `dist_tag` output).
      - name: Publish with npm trusted publishing and provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish dist/package.tgz --tag "${{ steps.verify-tag.outputs.dist_tag }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: dist/package.tgz
          if-no-files-found: error

  github-release:
    name: Attach the published artifact
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Create or repair the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          RELEASE_FLAGS=(--verify-tag --generate-notes)
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_FLAGS[@]}"
          gh release upload "${GITHUB_REF_NAME}" dist/package.tgz --clobber
