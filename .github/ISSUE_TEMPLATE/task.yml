name: Task
description: Repository work — tooling, automation, refactor, hardening, or docs
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Triage assigns a `priority: P0`–`P3` label; leave it unset when filing.
        A task whose approach is not settled yet gets `blocked: design` and is
        not picked up automatically until that is cleared.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong today
      description: Current behavior, with `path:line` where you can point at it.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done means
      description: >-
        The observable result that closes this issue, as something a reviewer
        can check without guessing. Name the test or command that proves it.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must land first. Leave empty when there are none.
      placeholder: "Depends on: #12"
    validations:
      required: false
